<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef1eb">
  <title>Activos | Logística</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18221f;
      --muted: #68736d;
      --paper: #eef1eb;
      --line: #d5ddd4;
      --green: #14634d;
      --orange: #b44e2d;
      --white: #fbfcf8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(135deg, rgba(20, 99, 77, 0.035) 25%, transparent 25%),
        linear-gradient(315deg, rgba(20, 99, 77, 0.035) 25%, transparent 25%);
      background-size: 18px 18px;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .shell {
      width: min(100% - 40px, 880px);
      margin: 0 auto;
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: var(--green);
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a8968;
      box-shadow: 0 0 0 3px rgba(74, 137, 104, 0.13);
    }

    main { padding: 76px 0 88px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.13em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 58px);
      font-weight: 500;
      line-height: 1.05;
    }

    .rule {
      width: 54px;
      height: 4px;
      margin: 23px 0 34px;
      background: var(--orange);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .action {
      min-height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 23px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--green);
      color: var(--ink);
      background: var(--white);
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .action:last-child { border-top-color: var(--orange); }

    .action:hover {
      transform: translateY(-3px);
      border-color: #aebdb1;
      box-shadow: 0 10px 24px rgba(24, 34, 31, 0.08);
    }

    .action:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 3px;
    }

    .action-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      line-height: 1.2;
    }

    .arrow {
      color: var(--green);
      font-size: 26px;
      line-height: 1;
    }

    .action:last-child .arrow { color: var(--orange); }

    footer {
      padding: 17px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.07em;
    }

  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">L</span> LOGISTICA</div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span> Sistema activo</div>
    </header>

    <main>
      <p class="eyebrow">CONTROL DE INVENTARIO</p>
      <h1>Activos</h1>
      <div class="rule" aria-hidden="true"></div>

      <nav class="actions" aria-label="Acciones de activos">
        <a class="action" href="./activos/registrar.html">
          <span class="action-label">Registrar activo</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="action" href="./activos/listar.html">
          <span class="action-label">Ver activos</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </nav>
    </main>

    <footer>LOGISTICA / GESTION DE ACTIVOS</footer>
  </div>
</body>
